# cosmos-agent config for the Jupiter stack.
#
# Save alongside docker-compose.yml as `cosmos-agent.toml`.
# Sign-in is through Authentik (authentik/blueprints/cosmos.yaml), so nothing
# secret is here.

node_name = "jupiter"

# Off by default: a node is read-only until you say otherwise. Gates every
# change the app can make (start, stop, restart and remove for containers and
# volumes), and even then only for admins. The agent always refuses to act on
# its own container. Must sit above the first [section].
allow_actions = false

[server]
bind = "0.0.0.0:7700"

[auth]
# Browser EventSource/WebSocket cannot set headers, so the web build needs
# this. The Tauri app uses the Authorization header either way.
allow_query_token = true
allow_anonymous = false

[auth.oidc]
issuer = "https://auth.jupiter.sunstead.net/application/o/cosmos/"
client_id = "cosmos"
admin_groups = ["homelab-admins"]

# No [cors] needed: the image serves the web UI from the agent's own origin.
# The desktop app's origins are built in.

[host]
interval_ms = 1000

# Under host networking the agent sees docker0 and every per-container veth.
# Summing those into "node throughput" counts container traffic two or three
# times over.
net_exclude = ["lo*", "docker*", "br-*", "veth*", "virbr*", "tailscale*"]

# In a container /proc/mounts is full of overlayfs and bind mounts, so the
# filesystems worth charting are listed explicitly. `path` is what the agent
# sees; `label` is what the UI shows.
[[host.disks]]
path  = "/host/rootfs"
label = "/"

# Uncomment once BACKUP_PATH points at a separate drive, and add the matching
# bind mount in compose:
# [[host.disks]]
# path  = "/host/backups"
# label = "/srv/backups"

[docker]
socket = "/var/run/docker.sock"
interval_ms = 2000
stats_concurrency = 8

allow_logs = true
watch_events = true

[history]
enabled = true
path = "/var/lib/cosmos-agent/metrics.db"
retain_1s_secs = 3600      # 1 hour at full resolution
retain_1m_secs = 604800    # 7 days
retain_5m_secs = 7776000   # 90 days

[backups]
enabled = true
status_file = "/host/backups/restic-status.json"
# mtime = when jupiter-backup.timer last fired. If this is newer than the
# status file, the timer ran but backup.sh died before finishing — which a
# snapshot list alone would never reveal.
timer_stamp = "/host/systemd-timers/stamp-jupiter-backup.timer"
expected_interval_secs = 86400   # nightly at 03:00
repo_label = "jupiter/restic"

[tailscale]
# Lists tailnet devices on the Network page and in the constellation. Reads
# the host's tailscaled socket; tailscaled gives a non-root caller read-only
# access, so this can't change anything in Tailscale. No API key involved.
enabled = true
socket = "/host/tailscale/tailscaled.sock"
interval_ms = 10000

[wol]
# Wake-on-LAN from the Network page. Machines are added in the app and kept
# in [state] path; waking and editing also need allow_actions and an admin.
# The agent sends magic packets from the host's network (host networking),
# so this node has to be on the same LAN as the machines it wakes.
enabled = true
interval_ms = 10000
# How long to watch for a machine to come up before calling the wake failed.
wake_timeout_secs = 180

[state]
# Settings edited from the UI. Must be on the writable volume.
path = "/var/lib/cosmos-agent/state.db"
