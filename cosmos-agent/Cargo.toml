[package]
name = "cosmos-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
cosmos-common = { path = "../cosmos-common" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
tower-http = { version = "0.5", features = ["cors"] }
bollard = "0.17"
futures-util = "0.3"
chrono = "0.4"