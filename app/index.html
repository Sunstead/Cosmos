<!doctype html>
<html lang="en" class="dark" data-theme="cosmos-dark" data-style="rounded" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmos</title>
    <script>
      // Apply the saved theme before first paint, so nothing flashes.
      // Keep the ids, schemes and styles in step with src/lib/themes.ts (a test checks).
      (function () {
        var themes = {
          'cosmos-dark': 'dark rounded',
          nebula: 'dark rounded',
          aurora: 'dark rounded',
          mars: 'dark rounded',
          'event-horizon': 'dark rounded',
          eclipse: 'dark rounded',
          'deep-field': 'dark rounded',
          'cosmos-light': 'light rounded',
          solar: 'light rounded',
          lunar: 'light rounded',
          comet: 'light rounded',
          hologram: 'dark tech',
          terminal: 'dark tech',
          'red-alert': 'dark tech',
          blueprint: 'light tech',
        };
        var info = function (id) {
          return Object.prototype.hasOwnProperty.call(themes, id) ? themes[id].split(' ') : null;
        };
        try {
          var t = localStorage.getItem('cosmos-theme') || 'cosmos-dark';
          if (t === 'system') {
            var s = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            t = localStorage.getItem('cosmos-theme-' + s);
            // Follow system pairs rounded themes only.
            if (!info(t) || info(t)[0] !== s || info(t)[1] !== 'rounded') t = 'cosmos-' + s;
          } else if (t === 'dark' || t === 'light') {
            t = 'cosmos-' + t; // before 0.10
          }
          if (!info(t)) t = 'cosmos-dark';
          var root = document.documentElement;
          root.setAttribute('data-theme', t);
          root.setAttribute('data-style', info(t)[1]);
          root.className = info(t)[0];
          root.style.colorScheme = info(t)[0];
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
