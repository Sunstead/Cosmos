name: Agent image

# Builds cosmos-agent (with the bundled web UI) and publishes it to GHCR.
#   main     -> :latest, :main, :sha-<short>
#   v1.2.3   -> :1.2.3, :1.2, :sha-<short>
# Pull requests build without pushing.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - cosmos-agent/**
      - cosmos-common/**
      - app/**
      - '!app/src-tauri/**'
      - Cargo.toml
      - Cargo.lock
      - .dockerignore
      - .github/workflows/agent-image.yml
  pull_request:
    paths:
      - cosmos-agent/**
      - cosmos-common/**
      - app/**
      - '!app/src-tauri/**'
      - Cargo.lock
      - .github/workflows/agent-image.yml
  workflow_dispatch:

concurrency:
  group: agent-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR image names must be lowercase; the owner may not be.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cosmos-agent" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=cosmos-agent
            org.opencontainers.image.description=Cosmos homelab agent and web UI

      # Build once into the local daemon so the image can be checked before
      # anything is published. The push below reuses the same cache.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cosmos-agent/Dockerfile
          platforms: linux/amd64
          load: true
          tags: cosmos-agent:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail
          # The data dir must be owned by the agent's uid, or a fresh named
          # volume comes up root-owned and history can't be written.
          cid=$(docker create cosmos-agent:test)
          docker export "$cid" | tar -tvf - | grep -E ' var/lib/cosmos-agent/?$' | tee /dev/stderr | grep -q '65532/65532'
          docker rm "$cid" >/dev/null

          # An issuer nothing answers at: the agent must still start and
          # refuse unauthenticated reads.
          docker run -d --name smoke -p 7700:7700 \
            -e COSMOS_AGENT_OIDC_ISSUER=http://127.0.0.1:9/application/o/cosmos/ \
            -v smoke_data:/var/lib/cosmos-agent cosmos-agent:test
          for i in $(seq 30); do curl -fsS localhost:7700/healthz >/dev/null && break; sleep 1; done

          curl -fsS localhost:7700/ | grep -q 'id="root"'
          curl -fsS localhost:7700/nodes/anything | grep -q 'id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:7700/v1/host)" = 401
          curl -fsS localhost:7700/v1/info | grep -q '"metrics_history":true'
          curl -fsS localhost:7700/v1/info | grep -q '"kind":"oidc"'

          docker logs smoke 2>&1 | tee agent.log
          grep -q 'metrics history enabled' agent.log
          if grep -q $'\x1b' agent.log; then echo 'ANSI escapes in docker logs' >&2; exit 1; fi

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cosmos-agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
