name: App release

# Builds the desktop app and attaches installers to a draft GitHub Release.
#
# Release:  npm run release -- 0.2.0 --push   (from app/, on main)
#           pushes tag app-v0.2.0, which runs this workflow.
# Check:    pull requests touching the Tauri shell build without releasing,
#           and upload the installers as workflow artifacts.
# Updates:  tag builds sign update bundles with TAURI_SIGNING_PRIVATE_KEY and
#           attach latest.json; publishing the draft ships it to every install.

on:
  push:
    tags: ['app-v*']
  pull_request:
    paths:
      - app/src-tauri/**
      - .github/workflows/app-release.yml
  workflow_dispatch:

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            # --verbose shows bundle_dmg.sh's own output, which says why it failed.
            args: --target universal-apple-darwin --verbose
          - name: Windows
            os: windows-latest
            rust-targets: ''
            args: ''
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        id: version
        if: startsWith(github.ref, 'refs/tags/app-v')
        shell: bash
        run: |
          app_version=$(node -p "require('./app/package.json').version")
          if [ "${GITHUB_REF_NAME#app-v}" != "$app_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app/package.json version $app_version. Use npm run release."
            exit 1
          fi
          # A suffix (0.13.0-beta.1) is a pre-release. Read off the version, not
          # the tag, whose own "app-" has a dash in it.
          if [[ "$app_version" == *-* ]]; then pre=true; else pre=false; fi
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The frontend imports TypeScript types that ts-rs writes during tests.
      - name: Generate bindings
        run: cargo test --locked -p cosmos-common --quiet

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        # bundle_dmg.sh sometimes fails on GitHub's macOS runners and passes on
        # a second try (0.9.0 did); the retry below reuses the compiled app.
        continue-on-error: ${{ runner.os == 'macOS' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: npm run tauri
          # Tag builds also make the signed update bundles and latest.json the
          # app's updater reads; other builds have no key to sign them with.
          args: ${{ matrix.args }} ${{ startsWith(github.ref, 'refs/tags/app-v') && '--config src-tauri/tauri.updater.conf.json' || '' }}
          # Only tag builds publish; everything else just builds.
          tagName: ${{ startsWith(github.ref, 'refs/tags/app-v') && github.ref_name || '' }}
          releaseName: Cosmos __VERSION__
          releaseBody: |
            Cosmos desktop app __VERSION__.

            **macOS:** Cosmos_*_universal.dmg (Apple Silicon and Intel). The app is not notarised yet: on first launch use right-click > Open, or System Settings > Privacy & Security > Open Anyway.
            **Windows:** the -setup.exe or .msi installer. SmartScreen may warn about an unrecognised app: More info > Run anyway.
          releaseDraft: true
          # The updater only reads the latest full release, so this decides
          # whether installs see it.
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}

      # The one retry. Nothing was uploaded by the failed attempt: tauri-action
      # attaches installers only after they have all been built.
      - uses: tauri-apps/tauri-action@v0
        if: steps.tauri.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: npm run tauri
          # Tag builds also make the signed update bundles and latest.json the
          # app's updater reads; other builds have no key to sign them with.
          args: ${{ matrix.args }} ${{ startsWith(github.ref, 'refs/tags/app-v') && '--config src-tauri/tauri.updater.conf.json' || '' }}
          # Only tag builds publish; everything else just builds.
          tagName: ${{ startsWith(github.ref, 'refs/tags/app-v') && github.ref_name || '' }}
          releaseName: Cosmos __VERSION__
          releaseBody: |
            Cosmos desktop app __VERSION__.

            **macOS:** Cosmos_*_universal.dmg (Apple Silicon and Intel). The app is not notarised yet: on first launch use right-click > Open, or System Settings > Privacy & Security > Open Anyway.
            **Windows:** the -setup.exe or .msi installer. SmartScreen may warn about an unrecognised app: More info > Run anyway.
          releaseDraft: true
          # The updater only reads the latest full release, so this decides
          # whether installs see it.
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}

      - name: Upload installers
        if: ${{ !startsWith(github.ref, 'refs/tags/app-v') }}
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-${{ runner.os }}
          path: |
            target/*/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
