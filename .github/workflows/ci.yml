name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # The Tauri crate needs WebKitGTK to build on Linux, so CI covers the
      # agent and shared types. Testing cosmos-common also generates the TS
      # bindings the frontend needs.
      - name: Rust tests
        run: cargo test --locked -p cosmos-common -p cosmos-agent
      - name: Clippy
        run: cargo clippy --locked -p cosmos-common -p cosmos-agent --all-targets -- -D warnings

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Frontend
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm test
          npm run build
